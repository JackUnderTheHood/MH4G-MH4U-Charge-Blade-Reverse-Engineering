<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">GP 与红盾瓶爆机制流程图</title>
  <desc id="desc">动作到达 GP 判定应当生效的时机后，0x10 提供防御成立所需的关键条件，0x2000 只修正后退判定。成功接触后判断红盾，无红盾只防御，有红盾则进入原生瓶爆、碰撞、结果队列和 HP 伤害链。</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 20px; fill: #475569; }
      .box-title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .box-sub { font-size: 20px; fill: #334155; }
      .small { font-size: 18px; fill: #475569; }
      .branch { font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f8fafc"/>
  <rect x="36" y="32" width="1528" height="986" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="800" y="82" text-anchor="middle" class="title">GP 与红盾瓶爆 / Guard Point &amp; Red-Shield Phial Burst</text>

  <!-- Native timing -->
  <rect x="430" y="120" width="740" height="100" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
      <text x="800" y="163" text-anchor="middle" class="box-title">动作到达 GP 判定应当生效的时机</text>
      <text x="800" y="196" text-anchor="middle" class="box-sub">Action reaches the point where GP can become active</text>

  <path d="M800 220 L800 275" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Guard acceptance -->
  <rect x="430" y="285" width="740" height="116" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
      <text x="800" y="330" text-anchor="middle" class="box-title">state+F0 bit 0x10：防御成立的关键条件</text>
      <text x="800" y="365" text-anchor="middle" class="box-sub">A required condition for a valid guard</text>
  <text x="800" y="391" text-anchor="middle" class="small">防御火光本身不能证明防御已经成立 / Guard sparks alone are not proof</text>

  <!-- Recoil modifier sidecar -->
  <rect x="1215" y="270" width="300" height="190" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <text x="1365" y="326" text-anchor="middle" class="box-title">bit 0x2000</text>
  <text x="1365" y="360" text-anchor="middle" class="box-sub">GP 后退修正</text>
  <text x="1365" y="388" text-anchor="middle" class="small">GP recoil adjustment</text>
  <text x="1365" y="416" text-anchor="middle" class="small">判定值 −10，最低 1 / min 1</text>
  <text x="1365" y="444" text-anchor="middle" class="small">不能单独建立防御 / cannot guard alone</text>

  <path d="M1170 342 L1215 342" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowGray)"/>
  <text x="1192" y="326" text-anchor="middle" class="small">修正</text>

  <path d="M800 401 L800 470" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Successful contact -->
  <rect x="430" y="480" width="740" height="108" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="524" text-anchor="middle" class="box-title">怪物攻击与盾牌成功接触</text>
  <text x="800" y="560" text-anchor="middle" class="box-sub">Successful guard contact</text>

  <path d="M800 588 L800 630" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Red shield decision -->
  <polygon points="800,640 1010,745 800,850 590,745" fill="#fff7ed" stroke="#ea580c" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="728" text-anchor="middle" class="box-title">红盾有效？</text>
  <text x="800" y="765" text-anchor="middle" class="box-sub">Red shield active?</text>

  <!-- No branch -->
  <path d="M590 745 L440 745" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrowGray)"/>
  <text x="518" y="721" text-anchor="middle" class="branch" fill="#475569">否 / NO</text>
  <rect x="80" y="688" width="350" height="114" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
  <text x="255" y="735" text-anchor="middle" class="box-title">只完成防御</text>
  <text x="255" y="771" text-anchor="middle" class="box-sub">Guard only</text>

  <!-- Yes branch -->
  <path d="M1010 745 L1120 745" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="1063" y="721" text-anchor="middle" class="branch" fill="#b91c1c">是 / YES</text>
  <rect x="1130" y="665" width="390" height="160" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="1325" y="705" text-anchor="middle" class="box-title">进入原生瓶爆提交</text>
  <text x="1325" y="739" text-anchor="middle" class="box-sub">Native phial-burst submission</text>
  <text x="1325" y="777" text-anchor="middle" class="small">快速：bit-2 消费链</text>
  <text x="1325" y="806" text-anchor="middle" class="small">蓄力：直接调用原生提交函数</text>

  <path d="M1325 825 L1325 873" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrowRed)"/>

  <!-- Damage pipeline -->
  <rect x="965" y="883" width="610" height="104" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="1270" y="927" text-anchor="middle" class="box-title">type-3 瓶爆对象 → 碰撞 → 结果队列 → HP 扣减</text>
  <text x="1270" y="962" text-anchor="middle" class="box-sub">Object → collision → result queue → HP damage</text>

  <!-- Summary note -->
  <rect x="80" y="900" width="760" height="86" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="935" text-anchor="middle" class="box-sub">关键区别：GP 不是一个单独 flag，瓶爆也不是防御火光。</text>
  <text x="460" y="967" text-anchor="middle" class="small">GP is layered state; phial burst is a separate successful-contact damage chain.</text>
</svg>
